name: Build and release

# Pull requests build and test Redfox and check that VERSION is newer than the latest
# release. Merging into main builds Redfox.dmg and publishes it as release v<VERSION>.
# The app checks that release for updates.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v5

      - name: Use the newest stable Xcode
        uses: maxim-lobanov/setup-xcode@v1
        with:
          xcode-version: latest-stable

      - name: Read and check the version
        id: version
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          VERSION="$(tr -d '[:space:]' < VERSION)"
          echo "value=$VERSION" >> "$GITHUB_OUTPUT"
          LATEST="$(gh api "repos/$GITHUB_REPOSITORY/releases/latest" --jq .tag_name 2>/dev/null | sed 's/^v//' || true)"
          echo "VERSION file says $VERSION, latest release is ${LATEST:-none}"
          if [ -n "$LATEST" ]; then
            NEWEST="$(printf '%s\n%s\n' "$LATEST" "$VERSION" | sort -V | tail -1)"
            if [ "$VERSION" = "$LATEST" ] || [ "$NEWEST" != "$VERSION" ]; then
              echo "::error::VERSION ($VERSION) must be higher than the latest release ($LATEST). Bump it in the VERSION file."
              exit 1
            fi
          fi

      - name: Reuse the downloaded ffmpeg between builds
        uses: actions/cache@v4
        with:
          path: vendor
          key: ffmpeg-${{ hashFiles('scripts/fetch-ffmpeg.sh') }}

      - name: Build the app
        run: |
          chmod +x scripts/*.sh
          scripts/build-app.sh "${{ steps.version.outputs.value }}"

      - name: Test every bundled encoder
        run: scripts/smoke-test-ffmpeg.sh

      - name: Package the disk image
        run: scripts/make-dmg.sh

      - name: Keep the DMG with this run
        uses: actions/upload-artifact@v5
        with:
          name: Redfox-${{ steps.version.outputs.value }}
          path: build/Redfox.dmg

      - name: Publish the release
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Keep only the human-written part of the commit message, without trailers.
          NOTES="$(git log -1 --pretty=%B | grep -viE '^(co-authored-by|claude-session|signed-off-by):' | sed -e :a -e '/^[[:space:]]*$/{$d;N;ba' -e '}')"
          [ -n "$NOTES" ] || NOTES="Bug fixes and improvements."
          gh release create "v${{ steps.version.outputs.value }}" build/Redfox.dmg \
            --title "Redfox ${{ steps.version.outputs.value }}" \
            --notes "$NOTES" \
            --latest
